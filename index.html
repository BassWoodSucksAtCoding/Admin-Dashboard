<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reset.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <script src="script.js" defer></script>
</head>
<body>
    <div id="content">
        <div id="sidebar">
            <ul>
                <li>
                    <img src="Images/account-box-multiple.svg" alt="dashboard-icon" width="30px" height="30px">
                    <h1>Library</h1>
                </li>
            </ul>
            <div>
                <ul>
                    <li>
                        <img src="Images/home.svg" alt="sidebar-icon" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Home</a>
                    </li>

                    <li>
                        <img src="Images/card-account-details-outline.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Profile</a>
                    </li>

                    <li>
                        <img src="Images/message.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Messages</a>
                    </li>

                    <li>
                        <img src="Images/clock-time-four.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">History</a>
                    </li>

                    <li>
                        <img src="Images/note-multiple.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Tasks</a>
                    </li>

                    <li>
                        <img src="Images/account-group.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Communities</a>
                    </li>
                </ul>
            </div>

            <div>
                <ul>
                    <li>
                        <img src="Images/cog.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Settings</a>
                    </li>

                    <li>
                        <img src="Images/message-question.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Support</a>
                    </li>

                    <li>
                        <img src="Images/shield-check.svg" class="sidebar-icons" width="25px" height="25px">
                        <a href="https://example.com">Privacy</a>
                    </li>
                </ul>
            </div>
        </div>

        <div id="main">
            <div id="header">
                <div id="top-left">
                    <img src="Images/magnify.svg" alt="search" width="25px" height="25px">
                    <input type="text">
                </div>

                <div id="top-right">
                    <img src="Images/PFP.png" alt="pfp" width="30px" height="30px">
                    <p>BassWood</p>
                </div>

                <div id="bottom-left">
                    <img src="Images/PFP.png" alt="pfp" width="60px" height="60px">
                    <div>
                        <p>Account: </p>
                        <h2>BassWood</h2>
                    </div>
                </div>

                <div id="buttons">
                    <button command="show-modal" commandfor="my-dialog" id="New">New</button>
                    <button>Upload</button>
                    <button>Share</button>

                    <dialog id="my-dialog">
                        <div>
                            <h2>Add new book to the library.</h2>
                        </div>
                        

                        <form id="dialogForm">
                            <div>
                                <label for="name">Name:</label>
                                <input type="text" id="name" name="name">
                            </div>

                            <div>
                                <label for="author">Author:</label>
                                <input type="text" id="author" name="author">
                            </div>

                            <div>
                                <label for="page-no">Number of Pages:</label>
                                <input type="tel" id="page-no" name="page-no">
                            </div>

                            <div>
                                <label for="desc">Description:</label>
                                <textarea id="desc" name="desc" rows="50" cols="4"> </textarea>
                            </div>

                            <div id="dialogButtons">
                                <button type="submit" id="dialogSubmit">Submit</button>
                                <button commandfor="my-dialog" command="close" id="dialogClose" type="button">Close</button>
                            </div>
                        </form>
                    </dialog>
                </div>
            </div>

            <div id="cards">
                <h3>Books</h3>
                <div id="cardsDiv">
                    <div class="card" id="progenitor-card">
                        <div class="card-text">
                            <h4>Super Cool Project</h4>
                            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                        </div>
                        <div class="card-icon">
                            <img src="Images/star-plus-outline.svg" alt="card-icon" width="25px" height="25px">
                            <img src="Images/eye-plus-outline.svg" alt="card-icon" width="25px" height="25px">
                            <img src="Images/source-branch.svg" alt="card-icon" width="25px" height="25px">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
